[project]
name = "bookshelf"
version = "0.1.0"
description = "A lean, self-hosted e-book library with KOReader progress sync and OPDS."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hannes Thöne" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "pillow>=11.0",
    "pypdf>=5.0",
    "bcrypt>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx2", "ruff>=0.8"]

[project.scripts]
bookshelf = "bookshelf.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bookshelf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["bookshelf/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Depends()/File() defaults are idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
