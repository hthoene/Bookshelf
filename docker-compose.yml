# Configure via a .env file next to this one (see .env.example) – no need to edit this file.
services:
  bookshelf:
    build: .
    image: bookshelf:latest
    container_name: bookshelf
    restart: unless-stopped
    ports:
      - "${BOOKSHELF_BIND_IP:-0.0.0.0}:${BOOKSHELF_HOST_PORT:-8080}:8080"
    environment:
      BOOKSHELF_ALLOW_REGISTRATION: ${BOOKSHELF_ALLOW_REGISTRATION:-false}
      BOOKSHELF_MAX_UPLOAD_MB: ${BOOKSHELF_MAX_UPLOAD_MB:-200}
      BOOKSHELF_SESSION_DAYS: ${BOOKSHELF_SESSION_DAYS:-30}
      BOOKSHELF_SECURE_COOKIES: ${BOOKSHELF_SECURE_COOKIES:-false}
      TZ: ${TZ:-UTC}
    volumes:
      - bookshelf-data:/data

volumes:
  bookshelf-data:
